---
- name: Provision and Deploy Smart Meter Consumption Dashboard
  hosts: local
  gather_facts: false
  vars:
    app_container_name: "smart-meter-prod"
    app_image: "smart-meter-dashboard:latest"
    app_port: "8082"

  tasks:
    - name: Ensure target application container is running
      ansible.builtin.shell: |
        docker ps -q -f name={{ app_container_name }}
      register: running_container
      changed_when: false

    - name: Deploy application container if not running
      ansible.builtin.shell: |
        docker run -d --name {{ app_container_name }} -p {{ app_port }}:8080 {{ app_image }}
      when: running_container.stdout == ""

    - name: Perform Health Check on Deployed Application
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/"
        status_code: 200
        timeout: 10
      register: health_check_result
      retries: 5
      delay: 3
      until: health_check_result.status == 200

    - name: Display Health Check Status
      ansible.builtin.debug:
        msg: "Health Check Passed! Service is operational on port {{ app_port }}"